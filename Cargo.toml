[package]
name = "prompt-context-router"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Claude Code hook that routes prompt keywords to project context files"
license = "MIT"
repository = "https://github.com/bengous/prompt-context-router"
readme = "README.md"
keywords = ["claude", "hooks", "context", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
jsonc-parser = { version = "0.33", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

# Keep startup fast on the blocking UserPromptSubmit path.
[profile.release]
strip = true

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
all = "deny"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
