[package]
name = "prompt-context-router"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
jsonc-parser = { version = "0.33", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

# Keep release builds fast: the hook recompiles via `cargo run` whenever
# source mtimes change, on the blocking UserPromptSubmit path.
[profile.release]
strip = true

[lints.rust]
unsafe_code = "forbid"
# No blanket `warnings = "deny"`: a future rustc warning must not break the
# runtime-compiled hook. CI strictness lives in scripts/check-rust.sh.
missing_debug_implementations = "deny"

[lints.clippy]
all = "deny"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
